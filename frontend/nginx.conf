# Serves the built client and proxies the two prefixes the client uses to the
# backend. Same-origin by construction, so `docker compose up` needs no CORS
# configuration anywhere in the backend.
#
# Both upstreams name `backend`, the one container the five backend services
# collapsed into. `backend` is a literal here rather than a variable, so nginx
# resolves it once at config load — which is why `web` declares a started-condition
# dependency on it: an unresolvable upstream is a refusal to start, not a 502.
#
# `Host` is forwarded as `$http_host` rather than `$host`, and the difference is one
# the backend now depends on. `$host` is the Host header **with the port removed**, so
# the stream's origin check — which asks whether the handshake's `Origin` names the
# same authority this port is being reached under (R26) — would compare
# `127.0.0.1:8790` against `127.0.0.1` and refuse the client it is meant to admit.
# Verified against nginx 1.29 directly: `$host` arrives as `127.0.0.1`, `$http_host`
# as `127.0.0.1:8790`.

server {
  listen 8790;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST commands. The /api prefix is the client's, not the backend's, so it is
  # stripped here — the backend serves /status, not /api/status.
  location /api/ {
    proxy_pass http://backend:8800/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The event stream. Without the upgrade headers this silently degrades to a
  # failed handshake rather than an error anyone can read.
  location /ws {
    proxy_pass http://backend:8800/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    # The tick loop can be quiet between events; do not cut the socket for it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
