# Serves the built client under the demo profile, and proxies the two prefixes
# the client uses to the gateway. Same-origin by construction, so the demo needs
# no CORS configuration anywhere in the backend.

server {
  listen 8790;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # A single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST commands. The /api prefix is the client's, not the gateway's, so it is
  # stripped here — the gateway serves /status, not /api/status.
  location /api/ {
    proxy_pass http://gateway:8800/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The event stream. Without the upgrade headers this silently degrades to a
  # failed handshake rather than an error anyone can read.
  location /ws {
    proxy_pass http://gateway:8800/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # The tick loop can be quiet between events; do not cut the socket for it.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
