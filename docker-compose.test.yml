# Publishes the store on the host, for the store suite only.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postgres
#   cd backend && uv run pytest tests/test_store.py
#
# This exists as a separate file rather than as a port in docker-compose.yml because
# R34 is deliberate: only the gateway and the client are published, and the store is
# reachable on the compose network alone. A test needing host access to Postgres is not
# a reason to open the running system's store to the host.
#
# Port 55432 rather than 5432, so it cannot collide with a Postgres the contributor
# already runs. Loopback only, like everything else that is published.
#
# The store suite skips its Postgres half with an explanatory message when this is not
# up, and runs the SQLite half regardless — but "skipped" is not "passed", and U6's
# verification requires both dialects.

services:
  postgres:
    ports:
      - '127.0.0.1:55432:5432'
