# --- what the company was already doing ---------------------------------------
#
# M6: a run opens on a person already holding an unsettled decision rather than on
# an idle floor. `done_percent` is percent of the item's own effort, and authoring
# it at a checkpoint's own percent is what makes the opening stop structural.

[[seeded_assignment]]
item = "wi_hiring"
person = "dir_hr"
done_percent = 45
