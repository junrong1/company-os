effect = { leadTime = -1, visibility = 3, morale = 1 }

[[item.checkpoint.option]]
label = "Both at once"
detail = "Fastest, and it spikes the team workload."
note = "Both causes tackled simultaneously"
effect = { leadTime = -3, draw = 10, morale = -3 }

[[item.checkpoint]]
at_percent = 75
kind = "approval"
label = "Approval"
prompt = "We can automate the manager approval above $10K with a value threshold. Where do you set it? This changes the authority policy, so it is your call."
