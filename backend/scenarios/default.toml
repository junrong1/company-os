# The shipped company. See schema.md in this directory for the format.
#
# Everything here is authored data: who sits where, who reports to whom, what work
# exists, and what each person says when the CEO asks. Nothing in it is executed —
# the tools, MCP servers and skills describe what a person is understood to have
# (M15, M16).

schema = 1
id = "default"
title = "Northwind Components"
summary = "A mid-size components company: ten people, four reporting lines, and eight pieces of work that each stop for a decision only the CEO can take."

# --- the four reporting lines -------------------------------------------------
#
# Fixed by the rules (M11): a scenario staffs these four and cannot add a fifth.
# `draw_hours_per_month` is the line's recurring baseline workload, in the same
# hours-per-month unit the Manual work metric displays — their sum *is* the
# starting value of that metric.
#
# Each draw is sized above what its own authored decisions can remove: Administration's
# take up to 86 h/mo between them, Sales 45, Customer Support 30. A draw smaller than
# that would let Manual work be driven to its floor and stop responding — at exactly
# the moment the automation gain landed, which is when it most needs to be readable.
# Their sum, 340, replaces the prototype's authored 420 against a maximum of 500.

[[department]]
id = "admin"
director = "dir_admin"
draw_hours_per_month = 120

[[department]]
id = "sales"
director = "dir_sales"
draw_hours_per_month = 100

[[department]]
id = "support"
director = "dir_cs"
draw_hours_per_month = 60

[[department]]
id = "hr"
director = "dir_hr"
draw_hours_per_month = 60

# --- the roster ---------------------------------------------------------------
#
# Order is load-bearing: it decides who wins a contested desk, and it is covered by
# the content hash. `room` is where someone sits; `manager` is whose line they are
# in. They disagree for Priya on purpose — see schema.md.

[[person]]
id = "dir_sales"
name = "Marcus Webb"
initials = "MW"
title = "VP, Sales"
room = "sales"
manager = ""
rank = "director"
seat_slot = 2
responsibility = "Owns the revenue number, and is the only approval for credit terms and discounts."
tools = ["Sales CRM", "Forecast workbook", "Email"]
mcp_servers = ["crm", "reporting-warehouse"]
skills = ["pipeline-review", "discount-approval", "territory-planning"]
deflection = "I would be guessing, and you would be able to tell. Ask me why the numbers land where they do, what reaches me, what is mine to approve, or what we all know is broken."

[person.voice]
why = "I see the numbers daily. Why they came out that way, I would have to ask the floor."
exception = "The exceptions live with the team. What reaches me is already too late to fix."
axis = "Credit and discounts are mine. Everything else sits with the account owner."
bottleneck = "The duplicate order entry. We know about it; nobody has a free hand to fix it."

[[person]]
id = "stf_order"
name = "Dana Reyes"
initials = "DR"
title = "Order Processing Specialist"
room = "sales"
manager = "dir_sales"
rank = "staff"
seat_slot = 0
responsibility = "Enters every order into the order system, and holds the delivery dates the floor promised."
tools = ["Order System", "Sales spreadsheet", "Stock enquiry terminal"]
mcp_servers = ["order-system", "inventory"]
skills = ["order-entry", "stock-reservation", "delivery-date-check"]
deflection = "I would not know about that. Ask me why the entry works the way it does, where the exceptions are, what I decide myself, or where the time goes."

[person.voice]
why = "Sales promises a date in their spreadsheet, then I retype it into the order system. Flip that order and sales cannot answer the customer."
exception = "For our three largest accounts I hold stock over the phone before I enter anything. That never shows up in the system."
axis = "I decide whether to pull a delivery date forward. Under three days I just do it and tell nobody."
bottleneck = "Typing the same numbers twice. About 25 hours a month."

[[person]]
id = "stf_field"
name = "Tom Baird"
initials = "TB"
title = "Account Executive"
room = "sales"
manager = "dir_sales"
rank = "staff"
seat_slot = 1
responsibility = "Carries the customer relationship on the road, and promises delivery dates at the table."
tools = ["Sales CRM", "Personal delivery spreadsheet", "Mobile phone"]
mcp_servers = ["crm"]
skills = ["account-visits", "verbal-order-intake", "delivery-promising"]
deflection = "That is not my end of it. Ask me why I keep my own numbers, what I take verbally, what I promise on my own, or what stops me on the road."

[person.voice]
why = "I carry my own spreadsheet so I can answer on delivery dates at the customer table. They cannot see our system."
exception = "Repeat orders I take verbally and collect the paperwork later."
axis = "The delivery promise is mine. I check stock with Dana, but urgent ones I call myself."
bottleneck = "I cannot process an order while I am travelling."

[[person]]
id = "dir_admin"
name = "Grace Okafor"
initials = "GO"
title = "Director, Administration"
room = "admin"
manager = ""
rank = "director"
seat_slot = 1
responsibility = "Runs the month-end close, and owns the manager approval threshold."
tools = ["Ledger", "Approval queue", "Close checklist"]
mcp_servers = ["ledger", "approval-queue"]
skills = ["month-end-close", "authority-policy", "supplier-relations"]
deflection = "I do not have that to hand. Ask me why the close runs long, what we let slide at quarter end, where the approval line sits, or what everything waits on."

[person.voice]
why = "The close takes five days for two reasons — waiting on paper invoices, and approvals sitting idle. Both causes start outside my department."
exception = "At quarter end we let the close run a day late to make the numbers line up."
axis = "Manager approval above $10K. That threshold can move. Nobody has decided to move it."
bottleneck = "Idle approvals. If the approver is travelling, everything parks for two days."

[[person]]
id = "stf_ap"
name = "Priya Raman"
initials = "PR"
title = "Accounts Payable"
room = "accounting"
manager = "dir_admin"
rank = "staff"
seat_slot = 0
responsibility = "Reconciles every invoice against its paper copy, and releases the payment run."
tools = ["Ledger", "Invoice scanner", "Payment run"]
mcp_servers = ["ledger", "document-store"]
skills = ["invoice-matching", "payment-release", "supplier-reconciliation"]
deflection = "That is above my desk. What I can tell you is why the reconciliation runs as it does, the exceptions I make, where my authority ends, and what eats the month."

[person.voice]
why = "Invoices arrive on paper and as PDF, so I reconcile both before I post anything. With only one of them, things slip through."
exception = "The last three days of the month I release payment before the paper arrives. Waiting would miss the supplier close."
axis = "Anything over $10K needs the manager approval. Nobody has revisited that line in five years."
bottleneck = "Matching. Seven minutes an invoice, four hundred invoices a month."

[[person]]
id = "stf_buyer"
name = "Victor Hale"
initials = "VH"
title = "Procurement Buyer"
room = "admin"
manager = "dir_admin"
rank = "staff"
seat_slot = 0
responsibility = "Collects competing quotes, and places every purchase order."
tools = ["Purchase order system", "Quote tracker", "Supplier directory"]
mcp_servers = ["purchasing", "supplier-directory"]
skills = ["quote-collection", "single-source-justification", "purchase-ordering"]
deflection = "No idea, honestly. Ask me why we quote the way we do, when I go single-source, what is mine to call, or where an order parks."

[person.voice]
why = "Three competing quotes on everything, so we can defend the price if an auditor asks."
exception = "Repairs and emergency parts go single-source. The plant stops otherwise, so I write the paperwork afterwards."
axis = "The three-quote rule ignores value. I collect three quotes for a thousand-dollar desk."
bottleneck = "Waiting for quotes to come back. Every order parks 2.5 days there."

[[person]]
id = "dir_cs"
name = "Nina Kaur"
initials = "NK"
title = "Customer Support Manager"
room = "support"
manager = ""
rank = "director"
seat_slot = 1
responsibility = "Owns first-line response time, and takes every cancellation and legal ticket herself."
tools = ["Ticket desk", "Answer templates", "Escalation board"]
mcp_servers = ["ticket-desk"]
skills = ["escalation-handling", "response-time-review", "template-authoring"]
deflection = "You would want someone closer to it than me. Ask me why first line costs what it does, what comes to me, how escalation actually works, or what fills Owen's day."

[person.voice]
why = "First-line response is entirely people. I cannot see a way to shrink it without losing quality."
exception = "Cancellations and anything legal come to me, regardless of content."
axis = "There is no written escalation rule. It is Owen judgement."
bottleneck = "Answering repeat questions. That is 60% of Owen time."

[[person]]
id = "stf_cs"
name = "Owen Cole"
initials = "OC"
title = "Support, First Line"
room = "support"
manager = "dir_cs"
rank = "staff"
seat_slot = 0
responsibility = "Answers the first-line queue, and decides what goes to engineering."
tools = ["Ticket desk", "Answer templates", "Knowledge base"]
mcp_servers = ["ticket-desk", "knowledge-base"]
skills = ["ticket-triage", "answer-drafting", "engineering-handoff"]
deflection = "Not something I see from first line. Ask me why the answers take as long as they do, what I escalate, what is my judgement, or what fills the queue."

[person.voice]
why = "I write the same answers by hand every time. We have templates, but I rework them for each customer."
exception = "Anything that mentions cancelling goes straight to Nina, whatever else it says."
axis = "Whether a ticket goes to engineering is my call. About five a day I genuinely cannot judge."
bottleneck = "Questions we have already answered. Six of every ten tickets."

[[person]]
id = "dir_hr"
name = "Ruth Bello"
initials = "RB"
title = "People Manager"
room = "hr"
manager = ""
rank = "director"
seat_slot = 1
responsibility = "Owns hiring lead time, and translates what a hiring manager wants into a posting."
