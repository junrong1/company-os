[[person]]
id = "stf_rec"
name = "Sam Delgado"
initials = "SD"
title = "Recruiter"
room = "hr"
manager = "dir_hr"
rank = "staff"
seat_slot = 0
responsibility = "Sources candidates, sets the first-round bar, and schedules every interview."
tools = ["Applicant tracker", "Job board", "Interview calendar"]
mcp_servers = ["applicant-tracker", "calendar"]
skills = ["candidate-sourcing", "first-round-screening", "interview-scheduling"]
deflection = "I could not say. Ask me why the postings drift, which candidates skip the process, where I set the bar, or what the scheduling costs."

[person.voice]
why = "What the hiring manager wants and what the job post says do not match. Rewriting it pauses the listing, so we run it as is."
exception = "Referrals skip the requirements entirely. That route actually retains better."
axis = "I set the first-round bar. I have never aligned it with the people who run the interviews."
bottleneck = "Interview scheduling. Six emails per candidate."

# --- the work -----------------------------------------------------------------
#
# Order is covered by the hash too: it is the order the catalog reaches the client
# in. Every checkpoint is a place the work stops until the CEO settles it.

[[item]]
id = "wi_ap_map"
title = "Map how accounts payable actually works"
brief = "Trace the real steps from invoice arrival to payment. Right now nobody in the company can explain who decides what."
room = "accounting"
want = "stf_ap"
effort_hours = 16
friction = "I am stuck reconciling paper against PDFs."
output_title = "AP process map (12 steps)"
output_kind = "Process map"
unlocks = ["wi_ap_auto"]
visit_meeting = false
final = false
effect = { visibility = 10 }
requires = { items = [] }

[[item.checkpoint]]
at_percent = 50
kind = "info"
label = "Information"
prompt = "Invoices arrive twice — once on paper, once as a PDF. Which one is the record? I cannot make that call."
tacit = "...for the last three days of every month we release payment before the paper even arrives. If we waited we would miss the supplier close. Nobody upstairs knows that."

[[item.checkpoint.option]]
label = "PDF is the record"
detail = "Paper becomes reference only. Everything gets searchable, but thirty suppliers need telling."
note = "PDF is the system of record"
effect = { visibility = 6, leadTime = -1, morale = -1 }

[[item.checkpoint.option]]
label = "Paper is the record"
detail = "Nothing changes on the floor. We can map it, but the waste stays."
note = "Paper stays the system of record"
effect = { visibility = 3 }

[[item.checkpoint.option]]
label = "Let the team decide"
detail = "Priya picks. Morale goes up, the rule drifts."
note = "Record of truth delegated to the team"
effect = { morale = 3, visibility = 1 }

[[item]]
id = "wi_ap_auto"
title = "Automate invoice matching"
brief = "Four of the twelve mapped steps eat 60% of the time. Find out whether a machine can take them."
room = "accounting"
want = "stf_ap"
effort_hours = 24
friction = "Running OCR accuracy tests. The quote came back."
output_title = "Invoice matching automation plan"
output_kind = "Automation candidate"
unlocks = []
visit_meeting = false
final = false
effect = { visibility = 4 }
requires = { items = ["wi_ap_map"] }

[[item.checkpoint]]
at_percent = 60
kind = "approval"
label = "Approval"
prompt = "The OCR matching quote is in: $120K up front, $8K a month, and {hours_word} hours of manual work disappear every month. I need your approval."
tacit = "...70% of the matching is the same three suppliers. You do not need all of them to get the benefit. That is not in the quote."

[[item.checkpoint.option]]
label = "Approve it"
detail = "Roll out to every invoice. The investment pays back and the human check stays."
note = "OCR matching approved for all invoices"
effect = { cash = -120, draw = -40, leadTime = -1, morale = 3 }

[[item.checkpoint.option]]
label = "Approve a limited rollout"
detail = "Top ten suppliers only. A third of the cost, a third of the benefit."
note = "Limited rollout to the top ten suppliers"
effect = { cash = -40, draw = -15, morale = 1 }

[[item.checkpoint.option]]
label = "Reject it"
detail = "No spend this year. The manual work stays."
note = "Automation rejected"
effect = { morale = -3 }

[[item]]
id = "wi_dup_entry"
title = "Kill the duplicate order entry"
brief = "The same figures get typed into a sales spreadsheet and the order system. {Hours_word} hours a month. Nobody has decided to stop it."
room = "sales"
want = "stf_order"
effort_hours = 20
friction = "Sales and the order desk disagree on which number is real."
output_title = "Duplicate order entry: options"
output_kind = "Automation candidate"
unlocks = []
visit_meeting = true
final = false
effect = { visibility = 8 }
requires = { items = [] }

[[item.checkpoint]]
at_percent = 45
kind = "decision"
label = "Decision"
prompt = "We enter the same figures twice — the sales spreadsheet and the order system. Which one do we kill?"
tacit = "...the spreadsheet holds the delivery date we actually promised. The system has no field for it. Kill the spreadsheet and sales starts lying to customers."

[[item.checkpoint.option]]
label = "Kill the spreadsheet"
detail = "One record. The hours vanish, but sales can no longer quote dates at the customer table."
note = "Spreadsheet retired, system is the record"
effect = { draw = -25, leadTime = -1, morale = -2 }

[[item.checkpoint.option]]
label = "Change the system to fit sales"
detail = "$60K of development. Sales keeps working the way it works; only the double entry goes."
note = "System modified to match how sales works"
effect = { cash = -60, draw = -18, morale = 2 }

[[item.checkpoint.option]]
label = "Leave it alone"
detail = "Do not touch it. The double entry stays."
note = "Duplicate entry continues"
effect = { morale = -1 }

[[item]]
id = "wi_faq"
title = "Cut first-line support with an FAQ"
brief = "Six of ten first-line tickets are questions we have answered before. Classify them and the queue stops needing a person."
room = "support"
want = "stf_cs"
effort_hours = 18
friction = "Classifying past tickets. Forty-eight so far."
output_title = "Ticket taxonomy and FAQ v1 (48 entries)"
output_kind = "Process map"
unlocks = []
visit_meeting = false
final = false
effect = { visibility = 7 }
requires = { items = [] }

[[item.checkpoint]]
at_percent = 55
kind = "approval"
label = "Approval"
prompt = "Publishing the FAQ should cut tickets 25%. The trade-off is that answer quality gets uneven. Do we publish?"
tacit = "...five tickets a day are the ones I genuinely cannot judge. Those five generate 80% of the complaints. An FAQ will not touch them."

[[item.checkpoint.option]]
label = "Publish it externally"
detail = "Goes to customers. Largest effect, and our mistakes go public too."
note = "FAQ published externally"
effect = { draw = -30, leadTime = -2, morale = 1 }

[[item.checkpoint.option]]
label = "Keep it internal"
detail = "Answer templates for the team. Half the effect, none of the exposure."
note = "FAQ kept as internal templates"
effect = { draw = -12 }

[[item.checkpoint.option]]
label = "Hold off"
detail = "Take no quality risk."
note = "FAQ publication deferred"
effect = { morale = -2 }

[[item]]
id = "wi_quotes"
title = "Revisit the three-quote purchasing rule"
brief = "Every purchase needs three competing quotes regardless of value. Each order parks 2.5 days waiting for them."
room = "admin"
want = "stf_buyer"
effort_hours = 14
friction = "Sorting two years of purchase orders by value."
output_title = "Purchasing policy revision (value thresholds)"
output_kind = "Policy change"
unlocks = []
visit_meeting = false
final = false
effect = { visibility = 6 }
requires = { items = [] }

[[item.checkpoint]]
at_percent = 50
kind = "decision"
label = "Decision"
prompt = "Three quotes on everything costs us 2.5 days per order. Do we change the rule?"
tacit = "...the three-quote rule came from an audit finding five years ago. That finding was closed long ago. Nobody has decided to remove the rule."

[[item.checkpoint.option]]
label = "One quote under $50K"
detail = "80% of orders go single-quote. Controls stay where the money is."
note = "Single quote permitted under $50K"
effect = { leadTime = -2, draw = -14, morale = 2 }

[[item.checkpoint.option]]
label = "One quote on everything"
detail = "Fastest possible. We also lose the ability to defend a price."
note = "Single quote on all purchases"
effect = { leadTime = -3, draw = -20, morale = -4 }

[[item.checkpoint.option]]
label = "Keep all three"
detail = "No change. Audit-proof and slow."
note = "Three-quote rule retained"
effect = { morale = -1 }

[[item]]
id = "wi_hiring"
title = "Shorten hiring lead time"
brief = "Two weeks to agree requirements, six emails to schedule one interview. Candidates accept elsewhere while we are still talking."
room = "hr"
want = "stf_rec"
effort_hours = 22
friction = "What the hiring manager wants and what the job post says do not match."
output_title = "Hiring requirements alignment process"
output_kind = "Process map"
unlocks = []
visit_meeting = false
final = false
effect = { visibility = 6 }
requires = { items = [] }

[[item.checkpoint]]
at_percent = 45
kind = "info"
label = "Information"
prompt = "The job post does not match what the hiring manager actually wants. Which one is right?"
tacit = "...referrals skip the requirements entirely, and they are the ones who stay. We have never measured that."

[[item.checkpoint.option]]
label = "The hiring manager version"
detail = "Rewrite the post. The listing goes dark for two weeks."
note = "Hiring manager requirements take precedence"
effect = { leadTime = -3, visibility = 4, morale = 1 }

[[item.checkpoint.option]]
label = "The job post"
detail = "The listing keeps running. We absorb the gap at interview stage."
note = "Existing job post stands"
effect = { morale = -2 }

[[item.checkpoint.option]]
label = "Put them in a room weekly"
detail = "More hours, but it stops recurring."
note = "Weekly requirements alignment introduced"
