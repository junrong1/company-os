[project]
name = "company-os-backend"
version = "0.1.0"
description = "Company OS backend: event-sourced kernel and the services around it"
readme = "README.md"

# Pinned to the 3.12 line, not merely floored at it. The interpreter on PATH is
# 3.9.12 and FastAPI, Starlette and Uvicorn all floor at 3.10, so a floor alone
# would let `uv run` pick whatever a contributor happens to have. The upper bound
# is what makes the failure loud instead of silently resolving a different line.
requires-python = ">=3.12,<3.13"

# Every version is pinned exactly. Two of these pins are load-bearing and are
# explained in README.md under "Why these versions are pinned"; the rest are
# pinned so that one `uv.lock` describes one resolution.
dependencies = [
  # --- web surface -------------------------------------------------------
  "fastapi==0.141.1",
  # Pinned deliberately. FastAPI 0.141.1 declares `starlette>=0.46.0` with no
  # upper bound, so a fresh install resolves Starlette 1.6.0 — which, along with
  # 1.4.0, 1.4.1, 1.5.0 and 1.5.1, was released *after* FastAPI 0.141.1 shipped
  # (2026-07-29) and therefore has never been tested against it. 1.3.1 is the
  # newest Starlette that existed at that point.
  "starlette==1.3.1",
  "uvicorn[standard]==0.52.2",
  "pydantic==2.13.4",
  # Starlette 1.3.1's TestClient warns that httpx is deprecated in favour of
  # httpx2. Staying on httpx: httpx2 2.10.0 was released 2026-08-09, after this
  # Starlette, so switching would trade a working deprecation for an untested
  # major. Trigger to revisit: Starlette dropping httpx support outright.
  "httpx==0.28.1",

  # --- inter-service contracts (U2) --------------------------------------
  "grpcio==1.76.0",
  "grpcio-tools==1.76.0",
  "protobuf==6.33.1",

  # --- log store (U6) ----------------------------------------------------
  "sqlalchemy==2.0.44",
  "psycopg[binary]==3.2.12",

  # --- kept off the event loop (U9) --------------------------------------
  "anyio==4.12.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
]

# `packages/` and `services/` are import roots rather than installed
# distributions, which is what keeps the plan's file paths literal:
# `packages/simcore/time.py` imports as `simcore.time` and can never shadow
# stdlib `time`, because a submodule reference is always fully qualified.
[tool.pytest.ini_options]
# "." puts `single_process.py` on the path. It is a launcher, not a service: it composes the
# kernel and the gateway for single-process mode, which neither may do for the other (R4).
pythonpath = ["packages", "services", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  # Ported parity assertions whose outcome depends on how much effort has burned by a
  # given moment. U7 changes the burn rate through capacity and morale, so these are
  # the ones expected to move — `pytest -m effort_timed` lists exactly what to review,
  # which is what makes that change deliberate rather than ambiguous.
  "effort_timed: parity assertion sensitive to the effort burn rate (see U5/U7)",
]
filterwarnings = [
  # Starlette 1.3.1 nudging toward httpx2; see the httpx pin above.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.uv]
package = false
