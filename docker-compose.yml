# Company OS — three containers.
#
#   docker compose up            the whole thing: store, backend, client
#
# There is one command and no profile. There were seven services and a `demo`
# profile, and the profile was the reason a bare `docker compose up` started no
# client at all: Compose selects a profiled service only when its profile is named,
# so the one command everybody tries brought up six backend services and nothing to
# look at. The five backend services are now one container running the launcher, and
# `web` is unconditional.
#
# Three rules shape this file.
#
# Exposure (R34): only `backend` and `web` publish ports, and only on the host's
# loopback interface. The store is reachable on the compose network alone. Inside a
# container the launcher binds every interface, which servicekit.runtime decides by
# looking for the container marker — a literal loopback bind inside a container is
# unreachable from siblings and from a published port.
#
# Ordering: a chain, `postgres` -> `backend` -> `web`, and only the first edge waits
# for health. The backend's first acts are schema creation, lease acquisition and a
# DDL check, which are startup failures rather than transients. `web` waits only for
# the backend to *start*, for two different reasons: nginx resolves `backend` at
# config load and will not start if the name does not exist yet, and a client that
# stayed down whenever the backend was unwell would turn one outage into two — the
# page's own status fallback is the useful thing to see when there is nothing to
# render.
#
# Credentials: two DSNs against one store. The writer connects as the owner; the
# report's fold connects as `report_reader`, which `infra/postgres/init` provisions
# with SELECT and nothing else. Both now live in one process, and that is exactly why
# the second DSN stays: a SQLAlchemy engine is per-DSN, not per-process, so the
# read-only role is still a real boundary and it is the only one that survives the
# report being written into the process that also appends.

name: company-os

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: companyos
      POSTGRES_PASSWORD: companyos
      POSTGRES_DB: companyos
      # Deterministic collation, so ordering never depends on the host locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U companyos -d companyos']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    build:
      context: ./backend
      target: backend
    # A fixed container name is what stops a second writer at the compose layer:
    # with one set, `docker compose up --scale backend=2` refuses to create more
    # than one container for this service.
    #
    # Verified behaviour, and the nuance matters: compose emits a *warning* and
    # starts **zero** instances of the service — it does not exit non-zero. So this
    # prevents two writers, but it must not be leaned on as a CI gate, and a
    # mis-scaled backend presents as "nothing came up".
    #
    # This is the first line of defence only. The actual enforcement is the writer
    # lease at the store, carrying owner identity, a heartbeat and a fencing token —
    # it also covers restarts, zombie resurrection, and a single-process launcher on
    # the host pointed at the compose store, none of which compose can see.
    container_name: company-os-backend
    ports:
      # The one backend port a human touches, on loopback only. The client reaches
      # it through nginx on the compose network; this mapping is for curl.
      - '127.0.0.1:8800:8800'
    environment:
      COMPANY_OS_STORE_URL: postgresql+psycopg://companyos:companyos@postgres:5432/companyos
      # The read-only role, provisioned by infra/postgres/init. The report folds the
      # log and must not be able to append to it. Declared here and resolved by the
      # report surface at U24, which is the unit that mounts it in this process —
      # keeping the variable now is what makes that a one-line change rather than a
      # decision to re-take once the writer and the reader share a process.
      COMPANY_OS_REPORT_STORE_URL: postgresql+psycopg://report_reader:report_reader@postgres:5432/companyos
      COMPANY_OS_LOG_LEVEL: INFO
      # Tick-level records are off by default: 36/s at x1, 108/s at x3.
      COMPANY_OS_LOG_TICKS: '0'
      # The bench, forwarded from the host and defaulting to empty. Written as
      # `${VAR:-}` rather than omitted, because an unset variable inside the
      # container is what "the bench is absent" already means — and M25 says
      # changing provider, model or base URL takes no code change, which would
      # stop being true here if reaching a provider from the one command required
      # editing this file. Empty is the shipped state: no key, no bench, every
      # other feature unchanged.
      #
      # The key is deliberately the only one with no default written anywhere. Do
      # not put a literal here; this file is committed. Export it in the shell
      # that runs `docker compose up`, or put it in a git-ignored `.env`.
      COMPANY_OS_MODEL_PROVIDER: ${COMPANY_OS_MODEL_PROVIDER:-}
      COMPANY_OS_MODEL: ${COMPANY_OS_MODEL:-}
      COMPANY_OS_MODEL_BASE_URL: ${COMPANY_OS_MODEL_BASE_URL:-}
      COMPANY_OS_MODEL_API_KEY: ${COMPANY_OS_MODEL_API_KEY:-}
      COMPANY_OS_MODEL_TIMEOUT_SECONDS: ${COMPANY_OS_MODEL_TIMEOUT_SECONDS:-}
      # Left to the shipped ceilings unless the host overrides them. Forwarding
      # rather than pinning matters: a number written here would be the one a
      # reader trusts, and it would silently diverge from modelgw.ceiling's.
      COMPANY_OS_MODEL_MAX_CALLS: ${COMPANY_OS_MODEL_MAX_CALLS:-}
      COMPANY_OS_MODEL_MAX_TOKENS: ${COMPANY_OS_MODEL_MAX_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Capped low so a crash stays visible instead of hiding in a restart loop.
    restart: on-failure:3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8800/status', timeout=2).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 768M
          # Five Python services at 384M each was 1.9 GB of ceiling for the backend
          # on an 8 GB laptop. One process hosting the same surfaces gets half that
          # and twice any single service's share, which is the headroom the tick
          # loop and a whole-run fold now want at the same time.

  web:
    build:
      context: ./frontend
      target: web
    ports:
      - '127.0.0.1:8790:8790'
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8790/']
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  postgres-data:
